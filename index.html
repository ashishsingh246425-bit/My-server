<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f6ff;
      text-align: center;
    }

    header {
      background: white;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .box {
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      color: #172554;
    }

    p {
      font-size: 20px;
      color: #555;
    }

    button {
      background: #1769e0;
      color: white;
      border: none;
      padding: 16px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #0d4fb5;
    }
  </style>
</head>

<body>

  <header>
    📚 Study Hub
  </header>

  <div class="box">

    <h1>आपकी सफलता अच्छी तैयारी से शुरू होती है</h1>

    <p>
      सामान्य ज्ञान, Maths, Science और Competitive Exams
    </p>

    <button onclick="startQuiz()">
      🧠 Start Quiz
    </button>

  </div>

  <script>
    function startQuiz() {
      alert("Quiz जल्द शुरू होगा! 🎓");
    }
  </script>

</body>
</html>
