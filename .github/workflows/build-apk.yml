name: Build Study Hub APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - - name: Build AAB
  run: gradle -p android bundleRelease

- name: Upload AAB
  uses: actions/upload-artifact@v4
  with:
    name: Study-Hub-Genius-Quiz-AAB
    path: android/app/build/outputs/bundle/release/app-release.aab
